name: Generate Linux Visual Baselines

on:
  workflow_dispatch:

jobs:
  generate-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start OmniQA Server
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000

      - name: Generate Linux Visual Baselines
        run: |
          npx playwright test tests/17-visual-regression \
            --project=chromium \
            --project=firefox \
            --project=webkit \
            --update-snapshots

      - name: Upload Linux Snapshot Baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines
          path: tests/17-visual-regression/**/*
          retention-days: 30