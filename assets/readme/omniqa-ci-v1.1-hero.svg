<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">OmniQA CI v1.1</title>
  <desc id="description">Enterprise quality engineering and three-browser GitHub-hosted certification</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a4c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#70e1b3"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#background)"/>
  <circle cx="1380" cy="-20" r="280" fill="#1c4772" opacity="0.35"/>
  <circle cx="145" cy="455" r="210" fill="#12365b" opacity="0.55"/>
  <path d="M95 92h16v336H95z" fill="url(#accent)"/>
  <text x="160" y="210" fill="#f8fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="118" font-weight="750" letter-spacing="9">OmniQA</text>
  <text x="166" y="274" fill="#9fc6ec" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="600" letter-spacing="4">ENTERPRISE QUALITY ENGINEERING &amp; CERTIFICATION</text>
  <text x="166" y="342" fill="#d9e9f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">Deterministic evidence. Real browser seams. Governed delivery.</text>
  <g transform="translate(1090 130)">
    <rect width="390" height="240" rx="24" fill="#081a30" stroke="#315e87" stroke-width="2"/>
    <circle cx="72" cy="72" r="30" fill="none" stroke="#70e1b3" stroke-width="8" filter="url(#glow)"/>
    <path d="M58 72l10 10 20-24" fill="none" stroke="#70e1b3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="65" fill="#f8fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">CI v1.1</text>
    <text x="120" y="101" fill="#70e1b3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">CERTIFIED</text>
    <path d="M42 135h306" stroke="#244868" stroke-width="2"/>
    <text x="42" y="181" fill="#d9e9f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Chromium</text>
    <text x="176" y="181" fill="#d9e9f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Firefox</text>
    <text x="282" y="181" fill="#d9e9f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">WebKit</text>
    <text x="42" y="220" fill="#9fc6ec" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">GitHub-hosted three-browser gate</text>
  </g>
</svg>
