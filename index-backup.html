<!DOCTYPE html>
<html>
<head>
  <title>OmniQA</title>
</head>

<body>

<h1>OmniQA</h1>

<h2>Quality Engineering Training Platform</h2>

<label for="search">Search Travel:</label>
<input type="text" id="search" placeholder="Search destinations" />

<br><br>

<label for="destination">Destination:</label>
<select id="destination">
  <option>Miami</option>
  <option>Cancun</option>
  <option>Nassau</option>
  <option>Barcelona</option>
</select>

<br><br>

<label for="travelType">Travel Type:</label>
<select id="travelType">
  <option>Cruise</option>
  <option>Hotel</option>
  <option>Flight</option>
</select>

<br><br>

<label for="email">Email:</label>
<input type="email" id="email" placeholder="Enter email" />

<br><br>

<label for="travelDate">Travel Date:</label>
<input type="date" id="travelDate" />

<br><br>

<h3>Promo Code</h3>

<label for="promoCode">Promo Code:</label>
<input type="text" id="promoCode" placeholder="Enter promo code" />

<br><br>

<h3>Payment Information</h3>

<label for="creditCard">Credit Card:</label>
<input type="text" id="creditCard" placeholder="Enter credit card number" />

<br><br>

<label for="expirationDate">Expiration Date:</label>
<input type="text" id="expirationDate" placeholder="MM/YY" />

<br><br>

<label for="cvv">CVV:</label>
<input type="text" id="cvv" placeholder="Enter CVV" />

<br><br>

<button id="searchButton">Search</button>

<br><br>

<button id="bookNowButton">Book Now</button>

<p id="searchResult"></p>
<p id="promoResult"></p>
<p id="paymentResult"></p>
<p id="bookingResult"></p>
<p id="priceDisplay">$1000</p>
<p id="inventoryStatus">Available</p>
<h3>Reservation Type</h3>

<label for="reservationType">Refund Option:</label>
<select id="reservationType">
  <option value="refundable">Refundable</option>
  <option value="non-refundable">Non-Refundable</option>
</select>

<br><br>

<label for="unitType">Unit Type:</label>
<select id="unitType">
  <option value="room">Room</option>
  <option value="stateroom">Stateroom</option>
</select>

<br><br>

<p id="confirmationNumber"></p>

<div id="results">
  <h3>Search Results</h3>
  <ul>
    <li><a href="#">Miami Bahamas Cruise - 4 Nights</a></li>
    <li><a href="#">Cancun Resort Getaway - 5 Nights</a></li>
    <li><a href="#">Barcelona Mediterranean Cruise - 7 Nights</a></li>
  </ul>
</div>

<script>

let paymentSuccessful = false;
let bookingCompleted = false;

function isLeapYear(year) {
  return (
    (year % 4 === 0 && year % 100 !== 0) ||
    year % 400 === 0
  );
}

document.getElementById('searchButton').addEventListener('click', function () {

  const searchValue = document.getElementById('search').value;
  const emailValue = document.getElementById('email').value;
  const travelDateValue = document.getElementById('travelDate').value;
  const promoCodeValue = document.getElementById('promoCode').value.trim();
  const creditCardValue = document.getElementById('creditCard').value;
  const expirationDateValue = document.getElementById('expirationDate').value;
  const cvvValue = document.getElementById('cvv').value;

  const searchResult = document.getElementById('searchResult');
  const promoResult = document.getElementById('promoResult');
  const paymentResult = document.getElementById('paymentResult');
  const bookingResult = document.getElementById('bookingResult');

  paymentSuccessful = false;
  bookingCompleted = false;

  searchResult.innerText = '';
  promoResult.innerText = '';
  paymentResult.innerText = '';
  bookingResult.innerText = '';

  if (emailValue === '') {
    searchResult.innerText = 'Email is required';
    return;
  }

  if (travelDateValue === '') {
    searchResult.innerText = 'Travel Date is required';
    return;
  }

  const selectedDate = new Date(travelDateValue);
  const year = selectedDate.getFullYear();
  const month = selectedDate.getMonth() + 1;
  const day = selectedDate.getDate() + 1;

  if (
  month === 2 &&
  day === 29 &&
  !isLeapYear(year)
) {
  searchResult.innerText =
    'Invalid leap year date';
  return;
}

const today = new Date();

today.setHours(0, 0, 0, 0);

if (selectedDate < today) {
  searchResult.innerText =
    'Travel Date cannot be in the past';
  return;
}

  if (promoCodeValue === '') {
    promoResult.innerText = 'Promo code is empty';
  } else if (promoCodeValue === 'SAVE10') {
    promoResult.innerText = 'Promo code applied: 10% discount';
  } else if (promoCodeValue === 'EXPIRED10') {
    promoResult.innerText = 'Promo code expired';
    return;
  } else if (promoCodeValue === 'USED10') {
    promoResult.innerText = 'Promo code already used';
    return;
  } else if (promoCodeValue === 'MAX50') {
    promoResult.innerText = 'Maximum discount applied';
  } else if (promoCodeValue === 'SAVE10,MAX50') {
    promoResult.innerText = 'Promo codes cannot be stacked';
    return;
  } else {
    promoResult.innerText = 'Invalid promo code';
    return;
  }

  if (creditCardValue === '') {
    paymentResult.innerText = 'Credit Card is required';
    return;
  }

  if (creditCardValue.length < 16) {
    paymentResult.innerText = 'Invalid Credit Card Number';
    return;
  }

  if (expirationDateValue === '') {
    paymentResult.innerText = 'Expiration Date is required';
    return;
  }

  if (cvvValue === '') {
    paymentResult.innerText = 'CVV is required';
    return;
  }

  if (creditCardValue === '4000000000000002') {
    paymentResult.innerText = 'Payment declined';
    return;
  }

  if (creditCardValue === '4000000000009995') {
    paymentResult.innerText = 'Payment timeout. Please try again.';
    return;
  }

  if (expirationDateValue === '01/20') {
    paymentResult.innerText = 'Card is expired';
    return;
  }

  if (cvvValue.length !== 3 || isNaN(cvvValue)) {
    paymentResult.innerText = 'Invalid CVV';
    return;
  }

  searchResult.innerText =
    'Searching for: ' + searchValue;

  paymentResult.innerText =
    'Payment successful';

  paymentSuccessful = true;
});

document.getElementById('bookNowButton').addEventListener('click', function () {

  const bookingResult =
    document.getElementById('bookingResult');

  if (paymentSuccessful === false) {
    bookingResult.innerText =
      'Booking blocked: payment must be successful first';
    return;
  }

  if (bookingCompleted === true) {
    bookingResult.innerText =
      'Duplicate booking prevented';
    return;
  }

  bookingResult.innerText =
    'Booking confirmed';

  bookingCompleted = true;

});

</script>

</body>
</html>
